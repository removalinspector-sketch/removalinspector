<!DOCTYPE html>
<html lang="en-ZA"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Downloads — Removal Inspector</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0B0F1E] text-[#E8EDF7] p-6">
<div class="max-w-[900px] mx-auto">
<h1 class="text-[28px] font-bold">My Downloads — Portal</h1>
<p class="text-[12px] text-white/50 mt-2">All kits purchased on this browser. Stored locally 48h. Ultimate unlocks all. For email backup check support@removalinspector.co.za</p>
<div id="grid" class="mt-6 grid md:grid-cols-2 gap-3"></div>
<div class="mt-8"><a href="index.html" class="text-[12px] underline">← Back to site</a></div>
</div>
<script>
const KITS = {
  "starter": {name:"Listing Clarity Starter", price:"R297", zip:"kits/RI-Starter-R297-Kit.zip"},
  "prescribed": {name:"Collections & Prescription Path", price:"R347", zip:"kits/RI-Prescribed-R347-Kit.zip"},
  "adverse": {name:"Arrears Correction Kit", price:"R397", zip:"kits/RI-Adverse-R397-Kit.zip"},
  "debt-review": {name:"Debt Review Exit Edu", price:"R497", zip:"kits/RI-DebtReview-R497-Kit.zip"},
  "judgement": {name:"Judgement Review Pathway", price:"R547", zip:"kits/RI-Judgment-R547-Kit.zip"},
  "ultimate": {name:"Full Shield Bundle", price:"R597", zip:"kits/ULTIMATE_BUNDLE_R597_KIT6.zip"}
};
function load(){ try{ return JSON.parse(localStorage.getItem("ri_purchases")||"{}"); }catch{ return {}; } }
const purchases = load();
const grid = document.getElementById("grid");
Object.entries(KITS).forEach(([id,k])=>{
  const p = purchases[id];
  const unlocked = p && Date.now() < p.expiry;
  const div = document.createElement("div");
  div.className = "rounded-[14px] border p-4 "+(unlocked?"bg-[#00E38A]/10 border-[#00E38A]/30":"bg-white/5 border-white/10");
  div.innerHTML = `<div class="text-[11px] font-bold">${k.price} • ${unlocked?"UNLOCKED":"LOCKED"}</div><div class="font-bold mt-1">${k.name}</div>${unlocked?`<div class="text-[10px] text-[#00E38A] mt-1">Expires ${new Date(p.expiry).toLocaleString()}</div><a href="${k.zip}" download class="mt-3 inline-flex h-9 px-4 items-center justify-center rounded-full bg-[#00E38A] text-black font-bold text-[12px]">Download ZIP</a>`:`<div class="mt-3 text-[11px] text-white/40">Not purchased on this browser. Buy via site.</div>`}`;
  grid.appendChild(div);
});
</script>
</body></html>
